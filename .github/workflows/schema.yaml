name: JSON Schema

on:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - ".github/workflows/schema.yaml"

jobs:
    schema:
      name: JSON Schema
      runs-on: ubuntu-latest
      # Use the repository's automatic token; no upstream-only bot secret is needed.
      # Write access is scoped to this job so it can commit resources/schema.json.
      permissions:
        contents: write
      steps:
        - name: Checkout Source Code
          uses: actions/checkout@v6

        - name: Setup Go Environment
          uses: actions/setup-go@v6
          with:
            go-version-file: go.mod

        - name: Build EaseProbe
          run: make

        - name: Generate JSON Schema
          run: ./build/bin/easeprobe -j > resources/schema.json

        - name: Commit JSON Schema
          uses: EndBug/add-and-commit@v10
          with:
            message: "Update JSON Schema"
            add: "resources/schema.json"
            author_name: "GitHub Actions"
            author_email: "actions@github.com"